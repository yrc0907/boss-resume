<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boss 投递助手</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header"><div><span class="eyebrow">LOCAL WORK QUEUE</span><h1>投递准备</h1></div><span id="queue-count" class="count-badge">0</span></header>
      <section class="notice"><strong>人工确认模式</strong><span>只筛选、填充和记录，不会自动发送。</span></section>
      <section class="settings-section">
        <div class="section-heading"><h2>筛选条件</h2><button id="save-settings" class="text-button" type="button">保存</button></div>
        <label>关键词<input id="keywords" placeholder="货代, 物流, 供应链" /></label>
        <label>城市<input id="locations" placeholder="深圳, 广州" /></label>
        <label>黑名单<input id="blacklist" placeholder="销售, 外包, 兼职" /></label>
        <label>最低匹配分<input id="min-score" type="number" min="0" max="100" step="5" /></label>
        <label>招呼语模板<textarea id="greeting" rows="3"></textarea></label>
        <p class="hint">可用变量：{{title}}、{{company}}、{{location}}</p>
      </section>
      <section class="queue-section"><div class="section-heading"><h2>候选队列</h2><div class="section-actions"><button id="export-queue" class="text-button" type="button">导出 CSV</button><button id="clear-queue" class="text-button danger" type="button">清空</button></div></div><div id="queue-list" class="queue-list"><p class="empty">还没有候选岗位</p></div></section>
      <footer class="popup-footer"><span id="status">准备就绪</span><a href="https://www.zhipin.com/" target="_blank" rel="noreferrer">打开 Boss 直聘</a></footer>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
